<text x="40" y="2015" text-anchor="start" font-size="20" font-weight="500" fill="#065F56"><tspan x="40" dy="0">規則：超過查勘天數 14 天且沒有公文說明時，系統才自動寄送稽催信與系統通知。</tspan></text>
