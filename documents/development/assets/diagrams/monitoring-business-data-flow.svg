<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1110" viewBox="0 0 1900 1110" role="img" aria-labelledby="title desc">
  <title id="title">地礦 AI 核心業務流程與資料流向</title>
  <desc id="desc">地礦 AI 核心業務流程與資料流向</desc>
  <rect width="1900" height="1110" fill="#FFFFFF"/>
  <g font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#007D6D"/></marker></defs>
<text x="60" y="72" text-anchor="start" font-size="40" font-weight="500" fill="#183B56"><tspan x="60" dy="0">地礦 AI 核心業務與資料流</tspan></text>
<text x="60" y="116" text-anchor="start" font-size="22" font-weight="400" fill="#64748B"><tspan x="60" dy="0">由 AI 建議點位開始，經監測、空拍、查勘與後續處理，最後形成統計與首頁摘要。</tspan></text>
<rect x="60" y="170" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="94" cy="204" r="22" fill="#007D6D"/><text x="94" y="212" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="94" dy="0">1</tspan></text><text x="128" y="207" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="128" dy="0">AI 判釋</tspan></text><rect x="84" y="263" width="104" height="36" rx="18" fill="#EDE9FE" stroke="none" stroke-width="1"/><text x="136" y="288" text-anchor="middle" font-size="18" font-weight="500" fill="#7C3AED"><tspan x="136" dy="0">忠晏</tspan></text><text x="84" y="324" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="84" dy="0">輸入：歷史資料</tspan><tspan x="84" dy="27">輸出：建議監測點位</tspan></text>
<rect x="420" y="170" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="454" cy="204" r="22" fill="#007D6D"/><text x="454" y="212" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="454" dy="0">2</tspan></text><text x="488" y="207" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="488" dy="0">建議監測點位</tspan></text><rect x="444" y="263" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="496" y="288" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="496" dy="0">育萱</tspan></text><text x="444" y="324" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="444" dy="0">依專案年度列入清單</tspan><tspan x="444" dy="27">可補充手動建議點位</tspan></text>
<rect x="780" y="170" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="814" cy="204" r="22" fill="#007D6D"/><text x="814" y="212" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="814" dy="0">3</tspan></text><text x="848" y="207" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="848" dy="0">圖台圈繪</tspan></text><rect x="804" y="263" width="104" height="36" rx="18" fill="#DCFCE7" stroke="none" stroke-width="1"/><text x="856" y="288" text-anchor="middle" font-size="18" font-weight="500" fill="#15803D"><tspan x="856" dy="0">金億</tspan></text><text x="804" y="324" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="804" dy="0">帶入選取點位</tspan><tspan x="804" dy="27">輸出：監測範圍圖資</tspan></text>
<rect x="1140" y="170" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1174" cy="204" r="22" fill="#007D6D"/><text x="1174" y="212" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="1174" dy="0">4</tspan></text><text x="1208" y="207" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="1208" dy="0">監測區位選定</tspan></text><rect x="1164" y="263" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="1216" y="288" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="1216" dy="0">育萱</tspan></text><text x="1164" y="324" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="1164" dy="0">地礦中心確認拍攝區位</tspan><tspan x="1164" dy="27">可新增欲空拍點位</tspan></text>
<rect x="1500" y="170" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1534" cy="204" r="22" fill="#007D6D"/><text x="1534" y="212" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="1534" dy="0">5</tspan></text><text x="1568" y="207" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="1568" dy="0">空拍通知與作業</tspan></text><rect x="1524" y="263" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="1576" y="288" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="1576" dy="0">育萱</tspan></text><text x="1524" y="324" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="1524" dy="0">輸入：拍攝區位與通知</tspan><tspan x="1524" dy="27">執行者：空拍廠商</tspan></text>
<rect x="1500" y="520" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1534" cy="554" r="22" fill="#007D6D"/><text x="1534" y="562" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="1534" dy="0">6</tspan></text><text x="1568" y="557" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="1568" dy="0">報告／KML 上傳</tspan></text><rect x="1524" y="613" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="1576" y="638" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="1576" dy="0">育萱</tspan></text><text x="1524" y="674" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="1524" dy="0">空拍廠商提供成果</tspan><tspan x="1524" dy="27">輸出：變異點與附件</tspan></text>
<rect x="1140" y="520" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1174" cy="554" r="22" fill="#007D6D"/><text x="1174" y="562" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="1174" dy="0">7</tspan></text><text x="1208" y="557" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="1208" dy="0">地礦中心通報</tspan></text><rect x="1164" y="613" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="1216" y="638" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="1216" dy="0">育萱</tspan></text><text x="1164" y="674" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="1164" dy="0">填寫通報查勘日期</tspan><tspan x="1164" dy="27">通知地方政府承辦</tspan></text>
<rect x="780" y="520" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="814" cy="554" r="22" fill="#007D6D"/><text x="814" y="562" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="814" dy="0">8</tspan></text><text x="848" y="557" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="848" dy="0">地方政府查勘</tspan></text><rect x="804" y="613" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="856" y="638" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="856" dy="0">育萱</tspan></text><text x="804" y="674" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="804" dy="0">回報結果與現場照片</tspan><tspan x="804" dy="27">逾期可上傳原因公文</tspan></text>
<rect x="420" y="520" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="454" cy="554" r="22" fill="#007D6D"/><text x="454" y="562" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="454" dy="0">9</tspan></text><text x="488" y="557" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="488" dy="0">稽催／違規後續</tspan></text><rect x="444" y="613" width="104" height="36" rx="18" fill="#DCFCE7" stroke="none" stroke-width="1"/><text x="496" y="638" text-anchor="middle" font-size="18" font-weight="500" fill="#15803D"><tspan x="496" dy="0">金億</tspan></text><rect x="558" y="613" width="104" height="36" rx="18" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="610" y="638" text-anchor="middle" font-size="18" font-weight="500" fill="#B45309"><tspan x="610" dy="0">育萱</tspan></text><text x="444" y="674" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="444" dy="0">未回報：產生稽催紀錄</tspan><tspan x="444" dy="27">確認違規：形成後續結果</tspan></text>
<rect x="60" y="520" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="94" cy="554" r="22" fill="#007D6D"/><text x="94" y="562" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF"><tspan x="94" dy="0">10</tspan></text><text x="128" y="557" text-anchor="start" font-size="24" font-weight="500" fill="#243746"><tspan x="128" dy="0">統計與首頁摘要</tspan></text><rect x="84" y="613" width="104" height="36" rx="18" fill="#DBEAFE" stroke="none" stroke-width="1"/><text x="136" y="638" text-anchor="middle" font-size="18" font-weight="500" fill="#2563EB"><tspan x="136" dy="0">守陽</tspan></text><text x="84" y="674" text-anchor="start" font-size="17" font-weight="400" fill="#64748B"><tspan x="84" dy="0">彙整監測、回報與違規</tspan><tspan x="84" dy="27">依角色顯示資料範圍</tspan></text>
<path d="M 360 285 L 404 285" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 720 285 L 764 285" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
