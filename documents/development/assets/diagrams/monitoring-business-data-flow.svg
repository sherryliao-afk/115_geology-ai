<path d="M 1650 400 L 1650 502" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 1500 635 L 1456 635" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 1140 635 L 1096 635" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 780 635 L 736 635" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 420 635 L 376 635" fill="none" stroke="#007D6D" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="825" width="1740" height="190" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="90" y="870" text-anchor="start" font-size="24" font-weight="500" fill="#183B56"><tspan x="90" dy="0">橫向共用能力</tspan></text>
<rect x="90" y="894" width="104" height="36" rx="18" fill="#DBEAFE" stroke="none" stroke-width="1"/><text x="142" y="919" text-anchor="middle" font-size="18" font-weight="500" fill="#2563EB"><tspan x="142" dy="0">守陽</tspan></text>
<text x="214" y="920" text-anchor="start" font-size="20" font-weight="400" fill="#243746"><tspan x="214" dy="0">登入／註冊、使用者管理與系統日誌支援各角色進入系統，但不改變業務資料的角色範圍。</tspan></text>
<text x="90" y="972" text-anchor="start" font-size="20" font-weight="400" fill="#64748B"><tspan x="90" dy="0">工程介接重點：忠晏 → 育萱（AI 點位）；育萱 ↔ 金億（清單與圖台）；育萱／金億 → 守陽（統計與首頁摘要）。</tspan></text>
  </g>
</svg>